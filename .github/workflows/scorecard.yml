# OpenSSF Scorecard — the workflow behind the Scorecard badge.
#
# The repository is public for trust: producers and ReaPack users are expected to
# read it before loading a native binary into their DAW. The Scorecard badge is
# part of how that trust is stated, and a badge needs a published result, which
# needs this workflow. Without it the badge has nothing to render and the
# commit-hash pinning everywhere else is a convention nobody can verify from
# outside.
#
# `publish_results: true` is what makes the result readable by the badge and the
# public API. It publishes only the Scorecard assessment of this repository —
# the checks it ran and the scores — and nothing about the code itself.
#
# Every action is pinned to a full 40-character commit SHA with the version in a
# trailing comment, same rule as `release.yml`, and particularly here: a
# Scorecard run that fails its own Pinned-Dependencies check would be a poor
# advertisement.

name: Scorecard

on:
  # The Branch-Protection check reads repository settings, so a settings change
  # is a reason to re-score.
  branch_protection_rule:

  schedule:
    # Weekly, Monday 07:40 UTC. An odd minute rather than the hour, because
    # on-the-hour cron is the busiest slot on the shared scheduler.
    - cron: "40 7 * * 1"

  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Upload the SARIF result to the code scanning dashboard.
      security-events: write

      # Mint the OIDC token Scorecard publishes its result with. This is what
      # `publish_results: true` needs, and it is why the job declares its own
      # permissions rather than inheriting the read-all above.
      id-token: write

      # The Branch-Protection and Webhooks checks read workflow and repository
      # metadata.
      actions: read
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard asks for this explicitly: a checkout that leaves a token
          # in the git config is a credential sitting in the workspace it is
          # about to analyse.
          persist-credentials: false

      - name: Run the Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      # Kept for the 90-day retention window, so a score that moves can be
      # compared against the run that moved it rather than guessed at.
      - name: Upload the result as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload the result to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard-results.sarif
